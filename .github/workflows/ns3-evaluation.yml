name: Reusable ns-3 evaluation

on:
  workflow_call:
    inputs:
      evaluation_name:
        description: Human-readable evaluation name.
        required: true
        type: string
      profile:
        description: Repository-relative experiment profile.
        required: true
        type: string
      run_directory:
        description: Repository-relative directory for all generated inputs and results.
        required: true
        type: string
      artifact_name:
        description: Artifact prefix; the workflow appends the GitHub run ID.
        required: true
        type: string
      ledger_issue:
        description: Ledger issue number for the calling run; zero disables publication.
        required: false
        default: 0
        type: number
      ledger_key:
        description: Stable ledger section identity, reused across re-runs.
        required: true
        type: string
      runtime_artifact:
        description: >
          Artifact name published by the caller's `native-build` job. Passed in
          so producer and consumer share one definition site.
        required: true
        type: string
      release_tag:
        description: >
          Release tag from the calling run's `ledger` job; empty disables
          archiving. Never derived here — deriving it per job would split a
          partial re-run across two releases.
        required: false
        default: ''
        type: string
      comparison:
        description: Run a matched comparison instead of one structural experiment.
        required: true
        type: boolean
      comparison_seed:
        description: Optional single seed for one independently scheduled matched pair; zero runs the default seed set.
        required: false
        default: 0
        type: number
      execution_timeout_minutes:
        description: Wall-clock guard for the run or comparison command.
        required: true
        type: number
      simulation_timeout_seconds:
        description: Wall-clock cap for each ns-3 simulator process.
        required: true
        type: number
      require_congestion:
        description: Fail a paired evaluation without raw queue, PFC, and background-traffic evidence.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ inputs.evaluation_name }}
    runs-on: ubuntu-22.04
    # The reusable workflow owns a complete hosted job. Callers reserve their
    # simulator and wrapper budgets below the six-hour GitHub Actions limit.
    timeout-minutes: 360
    # This job runs the compiled simulator for hours. It holds no write scope
    # at all; every outward-facing effect happens in the `archive` job below.
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # The prebuilt runtime replaces the native tree, so the expensive
        # recursive ns-3 clone is not needed here.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Unpack the native runtime built once for this run
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ inputs.runtime_artifact }}

    - name: Run structural ns-3 experiment
      if: ${{ !inputs.comparison }}
      run: |
        timeout --foreground ${{ inputs.execution_timeout_minutes }}m \
          uv run --locked python experiments/ring_3d/run.py \
          --profile "$EXPERIMENT_PROFILE" \
          --output "$EXPERIMENT_RUN_DIRECTORY" \
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }} \
          --clean

    - name: Run paired ns-3 comparison
      if: ${{ inputs.comparison }}
      run: |
        command=(
          uv run --locked python experiments/ring_3d/compare.py
          --profile "$EXPERIMENT_PROFILE"
          --output "$EXPERIMENT_RUN_DIRECTORY"
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }}
          --clean
        )
        if [[ "${{ inputs.require_congestion }}" == "true" ]]; then
          command+=(--require-congestion)
        fi
        if [[ "${{ inputs.comparison_seed }}" != "0" ]]; then
          command+=(--seeds ${{ inputs.comparison_seed }})
        fi
        timeout --foreground ${{ inputs.execution_timeout_minutes }}m "${command[@]}"

    - name: Publish structural researcher report
      if: ${{ always() && !inputs.comparison }}
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile "$EXPERIMENT_PROFILE" \
          --run-dir "$EXPERIMENT_RUN_DIRECTORY" \
          --output "$EXPERIMENT_RUN_DIRECTORY/research_report.md"
        cat "$EXPERIMENT_RUN_DIRECTORY/research_report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Publish paired comparison report
      if: ${{ always() && inputs.comparison }}
      run: |
        if [[ -f "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" ]]; then
          cat "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Paired evaluation did not produce a comparison report; inspect the retained diagnostics." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore

  archive:
    name: Record ${{ inputs.evaluation_name }}
    needs: evaluate
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # The only job here that holds write scopes. It runs `gh` and `tar` over a
    # downloaded bundle and never executes anything from it, so a malicious
    # artifact cannot reach the token.
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the evaluation report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}

    - name: Persist the evaluation report in the ledger
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ inputs.ledger_issue }}
        key: ${{ inputs.ledger_key }}
        title: ${{ inputs.evaluation_name }}
        body-file: ${{ inputs.run_directory }}/${{ inputs.comparison && 'comparison_report.md' || 'research_report.md' }}
        status: ${{ needs.evaluate.result }}

    - name: Archive the reproducibility bundle permanently
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ inputs.release_tag }}
        artifact: ${{ inputs.artifact_name }}-${{ github.run_id }}
        asset-name: ${{ inputs.artifact_name }}
