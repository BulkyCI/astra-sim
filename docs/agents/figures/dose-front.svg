<text x="228.1423076923077" y="122.71111111111111" font-size="10" fill="#1d4ed8">mask off</text>
<circle cx="554.5" cy="162.5" r="5" fill="white" stroke="#c2410c" stroke-width="2"/>
<text x="563.5384615384615" y="166.53333333333336" font-size="10" fill="#c2410c">mask off</text>
<text x="94" y="130" font-size="11.5" fill="#1d4ed8" font-weight="bold">FORGIVE, receiver forgives what the fabric trimmed</text>
<text x="94" y="148" font-size="11.5" fill="#c2410c" font-weight="bold">DBLP-style shedding, sender drops before sending</text>
<rect x="728" y="90" width="312" height="184" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="740" y="112" font-size="12" font-weight="bold">Three readings</text>
<text x="740" y="132" font-size="10.5" fill="#1e3a5f">1. The curve saturates. Budget 0.1 already buys</text>
<text x="740" y="147" font-size="10.5" fill="#1e3a5f">80 % of the gain at two thirds of the loss, so</text>
<text x="740" y="162" font-size="10.5" fill="#1e3a5f">the headline dose drops from 0.4 to 0.1.</text>
<text x="740" y="177" font-size="10.5" fill="#1e3a5f"></text>
<text x="740" y="192" font-size="10.5" fill="#1e3a5f">2. Aimed loss self-limits near 9.3 % because the</text>
<text x="740" y="207" font-size="10.5" fill="#1e3a5f">fabric stops trimming; blind loss is linear in the</text>
<text x="740" y="222" font-size="10.5" fill="#1e3a5f">dial and unbounded.</text>
<text x="740" y="237" font-size="10.5" fill="#1e3a5f"></text>
<text x="740" y="252" font-size="10.5" fill="#1e3a5f">3. Efficiency is flat: 1.4 to 1.7 points of time per</text>
<text x="740" y="267" font-size="10.5" fill="#1e3a5f">percent of gradient for FORGIVE, 0.3 to 0.4 for</text>
<text x="740" y="282" font-size="10.5" fill="#1e3a5f">shedding, at every budget.</text>
<rect x="728" y="286" width="312" height="124" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="740" y="308" font-size="12" font-weight="bold">What the phase mask costs</text>
<text x="740" y="328" font-size="10.5" fill="#4b5563">Hollow markers remove the protection on steps</text>
<text x="740" y="343" font-size="10.5" fill="#4b5563">1, 2, 3 and 20. Removing it buys 3.2 more points</text>
<text x="740" y="358" font-size="10.5" fill="#4b5563">of time for 2.3 more points of loss.</text>
<text x="740" y="373" font-size="10.5" fill="#4b5563"></text>
<text x="740" y="388" font-size="10.5" fill="#4b5563">Masked runs place 1.0 to 1.5 % of forgiven bytes</text>
<text x="740" y="403" font-size="10.5" fill="#4b5563">on those steps; unmasked runs place 19 to 21 %.</text>
<rect x="20" y="480" width="1020" height="62" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="32" y="500" font-size="11.5">Shedding only overtakes FORGIVE on time past a budget of about 0.45, where it is discarding a third of every gradient. No published tolerance result reaches there.</text>
<text x="32" y="522" font-size="11.5" font-weight="bold">At a dose the literature actually supports, FORGIVE recovers 10.4 to 10.9 % of training time and blind shedding recovers 2.4 to 3.3 %.</text>
</svg>
