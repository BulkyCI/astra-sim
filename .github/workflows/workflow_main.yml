name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_structural_studies:
        description: Run 100B structural topology studies
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A push is an independent experiment whose record must survive, so its group
  # is unique per run and no earlier run is ever cancelled. A pull-request run
  # is an iteration of a proposal rather than an experiment, so a newer push to
  # the same head supersedes the previous attempt and reclaims the runners.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ledger:
    name: Open the experiment ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Opens the run's release and its issue, so it needs contents:write.
    # It runs only `gh` and finishes in under a minute. Because every
    # evaluation gates on this job, downstream writers may assume the
    # release exists and never create one.
    permissions:
      contents: write
      issues: write
    outputs:
      # `0` is the disabled ledger. Emitting it unconditionally keeps every
      # downstream `needs:` edge live; a skipped job would silently skip the
      # whole graph behind it.
      issue: ${{ steps.open.outputs.issue || 0 }}
      # The run's identity, evaluated exactly once. Everything downstream takes
      # it as an opaque value; recomputing it per job would split a partial
      # re-run across two releases.
      release_tag: ${{ steps.open.outputs.release_tag }}
    steps:
    - name: Check out the ledger tool
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - name: Open the run's ledger issue and permanent archive
      id: open
      # A fork pull request holds a read-only token, and a proposal is not an
      # experiment; those runs are recorded by artifacts and the run summary.
      if: ${{ github.event_name != 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.github/scripts
      run: python3 -m ci_ledger open

  python-quality:
    name: Python tooling and experiment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # This job never touches the native tree. Skipping the recursive
        # submodule fetch removes the ns-3 clone from the critical path.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Verify lockfile and tooling
      run: |
        uv lock --check
        uv run --locked python -m compileall -q experiments/ring_3d experiments/dblp .github/scripts
        uv run --locked python -m unittest discover -s experiments/ring_3d/tests -v
        uv run --locked python -m unittest discover -s experiments/dblp/tests -v
        uv run --locked python -m unittest discover -s .github/scripts/tests -t .github/scripts -v
        bash -n experiments/ring_3d/smoke.sh experiments/ring_3d/failure_liveness.sh experiments/dblp/smoke.sh utils/setup.sh .github/workflows/setup.sh ci/dcs/build.sh ci/dcs/install-runtime.sh ci/dcs/seed-store.sh ci/dcs/resolve-runtime.sh ci/dcs/outbox.sh
        git diff --check

  native-build:
    name: Build the native backends
    needs: python-quality
    runs-on: ubuntu-24.04
    # A warm ccache build finishes in ~15 minutes, but the cache is evicted
    # after quiet weeks and the cold rebuild is an LTO link of ns-3 on four
    # hosted cores. 60 minutes sat close enough to a cold build to be a
    # coin flip; double it and let the build's own progress be the signal.
    timeout-minutes: 120
    outputs:
      # One definition site for the name, the same discipline the ledger issue
      # and release tag follow. Producer and consumer cannot drift apart.
      runtime_artifact: native-runtime-${{ github.run_id }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Build the native backends through the trusted compiler cache
      uses: ./.github/actions/native-build

    - name: Package the native runtime
      run: |
        set -euo pipefail
        # tar preserves the executable bit and the analytical build's symlinks;
        # the artifact uploader's own zip does not.
        tar -czf native-runtime.tar.gz \
          extern/network_backend/ns-3/build \
          build/astra_analytical/build
        ls -l native-runtime.tar.gz

    - name: Upload the native runtime
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('native-runtime-{0}', github.run_id) }}
        path: native-runtime.tar.gz
        # Already gzipped; re-compressing costs minutes and saves nothing.
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

  native-integration:
    name: Analytical regression and ns-3 smoke
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs compiled simulator code, so it holds no write scope. Recording
    # happens in archive-native-integration.
    permissions:
      contents: read

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # The prebuilt runtime replaces the native tree, so the expensive
        # recursive ns-3 clone is not needed here.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Unpack the native runtime built once for this run
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ needs.native-build.outputs.runtime_artifact }}

    - name: Run analytical regression suite
      run: bash ./.github/workflows/test.sh

    - name: Run 3D Ring ns-3 smoke experiment
      run: timeout --foreground 5m bash ./experiments/ring_3d/smoke.sh

    - name: Verify 3D Ring retry-exhaustion telemetry
      run: timeout --foreground 2m bash ./experiments/ring_3d/failure_liveness.sh

    - name: Verify separate DBLP injected-loss profile
      run: timeout --foreground 2m bash ./experiments/dblp/smoke.sh

    - name: Generate Llama 3 70B-class bucket trace
      run: |
        uv run --locked python experiments/ring_3d/generate.py \
          --profile experiments/ring_3d/profiles/llama3_70b_16.json \
          --output runs/ring_3d/llama3_70b_16 --clean

    - name: Publish 3D Ring researcher report
      if: always()
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile experiments/ring_3d/profiles/smoke_8.json \
          --run-dir runs/ring_3d/smoke_8 \
          --output runs/ring_3d/smoke_8/research_report.md
        cat runs/ring_3d/smoke_8/research_report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload 3D Ring researcher report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-research-report-${{ github.run_id }}
        path: runs/ring_3d/smoke_8/research_report.md
        if-no-files-found: error

    - name: Upload 3D Ring reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-smoke-results-${{ github.run_id }}
        path: runs/ring_3d/smoke_8
        if-no-files-found: ignore

    - name: Upload 3D Ring retry-exhaustion bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-retry-exhaustion-${{ github.run_id }}
        path: runs/ring_3d/retry_exhaustion_8
        if-no-files-found: ignore

    - name: Upload Llama 3 70B-class bucket trace
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-llama3-70b-16-trace-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16
        if-no-files-found: ignore

  archive-native-integration:
    name: Record the analytical regression and ns-3 smoke
    needs: [ native-integration, ledger ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Sink jobs run at the hosted ceiling: this one archives three bundles,
    # and the smoke bundles now carry raw transport streams whose size
    # scales with however long the smoke sims ran. Inner steps own the real
    # deadlines; the wall clock only reaps a wedged runner.
    timeout-minutes: 360
    # A sink job: the only place a write scope exists for this branch of the
    # graph. It runs `gh` and `tar` over downloaded bundles and executes
    # nothing from them.
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the researcher report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ring-3d-research-report-${{ github.run_id }}
        path: runs/ring_3d/smoke_8

    - name: Persist the 3D Ring researcher report
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ needs.ledger.outputs.issue }}
        key: native-integration
        title: Analytical regression and ns-3 smoke
        body-file: runs/ring_3d/smoke_8/research_report.md
        status: ${{ needs.native-integration.result }}

    - name: Archive the 3D Ring smoke bundle
      # A ledger failure must not cost the archives, and an earlier archive's
      # failure must not cost the later ones. Cancellation still stops the job.
      if: ${{ !cancelled() }}
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-smoke-results-${{ github.run_id }}
        asset-name: ring-3d-smoke-results

    - name: Archive the retry-exhaustion bundle
      # A ledger failure must not cost the archives, and an earlier archive's
      # failure must not cost the later ones. Cancellation still stops the job.
      if: ${{ !cancelled() }}
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-retry-exhaustion-${{ github.run_id }}
        asset-name: ring-3d-retry-exhaustion

    - name: Archive the Llama 3 70B-class bucket trace
      # A ledger failure must not cost the archives, and an earlier archive's
      # failure must not cost the later ones. Cancellation still stops the job.
      if: ${{ !cancelled() }}
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-llama3-70b-16-trace-${{ github.run_id }}
        asset-name: ring-3d-llama3-70b-16-trace

  cluster-build:
    name: Build the cluster runtime
    # Deliberately no upstream needs: every cluster arm waits on this job,
    # so it starts the moment the run does and the wave provisions as soon
    # as the bundles exist.
    runs-on: ubuntu-24.04
    # One cold LTO build of ns-3 per cell on four hosted cores - the same
    # rationale as native-build's budget: double the coin-flip 60, and let
    # the build's own progress be the signal. The compiler cache brings
    # the warm path far under this.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # The two ISA levels are independent builds of the same sources:
      # mapping them over two runners halves the wave's gate instead of
      # paying them in sequence on one, at the cost of one duplicated
      # ~10-minute env solve. Default fail-fast is correct here - the
      # wave needs both bundles, so a surviving sibling's work is dead
      # the moment either build fails.
      matrix:
        march: [ x86-64-v3, x86-64-v4 ]
    outputs:
      # One definition site for the artifact prefix, the same discipline
      # the native-runtime artifact follows; each cluster node appends the
      # ISA level it selects for itself. Every cell writes the identical
      # value (a pure function of the run id), so last-writer-wins across
      # the matrix is deterministic.
      runtime_artifact_prefix: cluster-runtime-${{ github.run_id }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    # Content-addressed like the native-build cache: identical native
    # sources and cluster scripts share one entry, and a near miss still
    # warms through the prefix fallback. The conda toolchain floats per
    # solve, so ccache's compiler_check=content (configured in
    # ci/dcs/build.sh) is what keeps a foreign entry harmless - a miss,
    # never a wrong object file. The ISA level lives in the prefix: the
    # cells' object sets are disjoint, and one shared key would leave the
    # second cell's save colliding with the first's.
    - name: Restore trusted compiler cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/astra-sim-ccache-dcs
        key: astra-sim-ccache-dcs-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.march }}-${{ hashFiles('astra-sim/**', 'build/**', 'extern/**', 'ci/dcs/**') }}
        restore-keys: astra-sim-ccache-dcs-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.march }}-

    - name: Build the ${{ matrix.march }} cluster runtime bundle
      env:
        CCACHE_DIR: ${{ runner.temp }}/astra-sim-ccache-dcs
        MARCH: ${{ matrix.march }}
      run: bash ci/dcs/build.sh "$MARCH"

    - name: Upload the ${{ matrix.march }} runtime
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('cluster-runtime-{0}-{1}', github.run_id, matrix.march) }}
        path: ${{ runner.temp }}/cluster-runtime-${{ matrix.march }}.tar.gz
        # Already gzipped; re-compressing costs minutes and saves nothing.
        compression-level: 0
        # A wave's runners fetch this only after an unbounded SLURM queue
        # wait; a week outlives the 4d20h walltime plus realistic queueing,
        # and the release asset in archive-cluster-runtime is the
        # permanent copy.
        retention-days: 7
        if-no-files-found: error

    - name: Publish compiler cache from a trusted ref
      # Same trust boundary as .github/actions/native-build: only a push to
      # main publishes an entry other refs can restore, and only on an
      # exact-key miss so one entry exists per distinct build input. Change
      # the two predicates together.
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/astra-sim-ccache-dcs
        key: ${{ steps.restore.outputs.cache-primary-key }}

  archive-cluster-runtime:
    name: Record the cluster runtime
    needs: [ cluster-build, ledger ]
    # A sink job off the critical path: blocks nothing, and skipping on
    # cancellation is the only way it does not run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Archive the x86-64-v3 runtime
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ${{ format('cluster-runtime-{0}-x86-64-v3', github.run_id) }}
        asset-name: cluster-runtime-x86-64-v3

    - name: Archive the x86-64-v4 runtime
      if: ${{ !cancelled() }}
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ${{ format('cluster-runtime-{0}-x86-64-v4', github.run_id) }}
        asset-name: cluster-runtime-x86-64-v4

  cluster-seed-provision:
    name: Provision the store seed runner
    needs: cluster-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Authenticates with repository secrets, not the workflow token.
    permissions: {}
    steps:
    - name: Check out the provisioning action
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/dcs-provision
        sparse-checkout-cone-mode: false

    - name: Mint a just-in-time runner and hand it to SLURM
      uses: ./.github/actions/dcs-provision
      with:
        runner-name: dcs-${{ github.run_id }}-${{ github.run_attempt }}-store-seed
        run-label: dcs-r${{ github.run_id }}-store-seed
        app-id: ${{ vars.DCS_APP_ID }}
        app-private-key: ${{ secrets.DCS_APP_PRIVATE_KEY }}
        ssh-key: ${{ secrets.DCS_SSH_KEY }}
        ssh-dest: ${{ vars.DCS_SSH_DEST }}
        ssh-host-key: ${{ vars.DCS_SSH_HOST_KEY }}

  cluster-seed:
    name: Seed the shared runtime store
    needs: [ cluster-build, cluster-seed-provision ]
    runs-on: dcs-r${{ github.run_id }}-store-seed
    # Two artifact downloads and a ~6 GB extraction onto network scratch;
    # generous against NFS, tiny against the wave it unblocks.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - name: Check out the store tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: ci/dcs
        sparse-checkout-cone-mode: false

    - name: Fetch both prebuilt cluster runtimes
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ needs.cluster-build.outputs.runtime_artifact_prefix }}-*
        merge-multiple: true

    # Single writer, before any reader exists: the wave provisions only
    # after this job ends, so the store needs no locks - the DAG is the
    # mutual exclusion. Publishes one sealed entry per ISA level; each
    # evaluation node later resolves the one its CPU supports.
    - name: Publish the sealed store entries
      env:
        PREFIX: ${{ needs.cluster-build.outputs.runtime_artifact_prefix }}
      run: |
        bash ci/dcs/seed-store.sh \
          "${PREFIX}-x86-64-v3=cluster-runtime-x86-64-v3.tar.gz" \
          "${PREFIX}-x86-64-v4=cluster-runtime-x86-64-v4.tar.gz"

  evaluation-plan:
    name: Plan the evaluation matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - name: Check out the evaluation matrix
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/workflows/evaluation-matrix.json
        sparse-checkout-cone-mode: false

    # The matrix is data: one record per evaluation pair, including its
    # rationale in `notes`. Adding an arm is one JSON record, not a
    # copy-pasted job. `gate` selects opt-in families.
    - name: Select the gated evaluation records
      id: plan
      env:
        INCLUDE_STRUCTURAL: ${{ github.event_name == 'workflow_dispatch' && inputs.run_structural_studies }}
      run: |
        set -euo pipefail
        matrix="$(jq -c --arg structural "$INCLUDE_STRUCTURAL" '
          [ .[]
            | select(.gate == "always"
                     or (.gate == "structural" and $structural == "true"))
            | del(.gate, .notes) ]
        ' .github/workflows/evaluation-matrix.json)"
        echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  evaluations:
    name: ${{ matrix.name }}
    # Still independent of native-build (the apt-toolchain build feeding
    # the hosted smoke path). Cluster arms consume the runtime bundles the
    # cluster-build matrix compiled once, so the wave gates on both cells:
    # a broken build now costs zero SLURM allocations - nothing is
    # provisioned - instead of sixteen runners discovering it
    # independently. Structural arms build for themselves through the
    # shared compiler cache and merely inherit this wait, which is
    # acceptable for a dispatch-only family.
    #
    # The store seed is sequenced before the wave but is only an
    # optimization layer: every arm falls back to a private extraction,
    # so the explicit condition tolerates a failed or skipped seed while
    # still hard-gating on the ledger, the plan, and the build (a plain
    # `needs` would skip the wave whenever the seed failed).
    needs: [ ledger, evaluation-plan, cluster-build, cluster-seed ]
    if: ${{ !cancelled()
            && needs.ledger.result == 'success'
            && needs.evaluation-plan.result == 'success'
            && needs.cluster-build.result == 'success' }}
    # Ceiling for the called workflow, not a grant to the simulator. Its
    # `evaluate` job declares `contents: read`; only `archive` takes the write.
    permissions:
      contents: write
      issues: write
    strategy:
      # Every record is an independent experiment arm whose outcome must be
      # recorded, so one failing arm never cancels the others. The account's
      # concurrent-job cap is the real parallelism budget.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.evaluation-plan.outputs.matrix) }}
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: ${{ matrix.name }}
      profile: ${{ matrix.profile }}
      run_directory: ${{ matrix.run_directory }}
      artifact_name: ${{ matrix.artifact_name }}
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      ledger_key: ${{ matrix.ledger_key }}
      comparison: ${{ matrix.comparison }}
      comparison_seed: ${{ matrix.comparison_seed }}
      execution_timeout_minutes: ${{ matrix.execution_timeout_minutes }}
      simulation_timeout_seconds: ${{ matrix.simulation_timeout_seconds }}
      require_congestion: ${{ matrix.require_congestion }}
      cluster_runtime_artifact: ${{ needs.cluster-build.outputs.runtime_artifact_prefix }}
    # For the DCS provision job only: the app key and deploy key live in
    # repository secrets, which a called workflow cannot see unless inherited.
    secrets: inherit

  aggregate-llama3-evaluation:
    name: Aggregate sixteen-seed Llama 3 70B congestion evaluation
    needs: [ evaluations, ledger ]
    # `always()` so an unrelated arm's failure cannot skip this aggregation;
    # the exact artifact count inside the reusable workflow is the real gate.
    if: ${{ always() }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/evaluation-aggregate.yml
    with:
      aggregate_name: Aggregate sixteen-seed Llama 3 70B congestion evaluation
      download_pattern: ring-3d-llama3-70b-16-comparison-seed-*-summary-${{ github.run_id }}
      download_directory: runs/ring_3d/llama3_70b_16_comparison/artifacts
      expected_count: 16
      command_prefix: uv run --locked python experiments/ring_3d/compare.py --clean --aggregate-inputs
      output_directory: runs/ring_3d/llama3_70b_16_comparison/aggregate
      report_file: comparison_report.md
      artifact_name: ring-3d-llama3-70b-16-comparison-aggregate
      ledger_key: llama3-70b-16-aggregate
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}

  aggregate-fanin-sweep:
    name: Aggregate the DP fan-in sweep
    needs: [ evaluations, ledger ]
    if: ${{ always() }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/evaluation-aggregate.yml
    with:
      aggregate_name: Aggregate the DP fan-in sweep
      download_pattern: ring-3d-llama3-70b-64-fanin-*-comparison-summary-${{ github.run_id }}
      download_directory: runs/ring_3d/llama3_70b_64_fanin/artifacts
      expected_count: 4
      command_prefix: uv run --locked python experiments/ring_3d/fan_in_sweep.py --comparison
      output_directory: runs/ring_3d/llama3_70b_64_fanin/sweep
      report_file: fan_in_sweep_report.md
      artifact_name: ring-3d-llama3-70b-64-fanin-sweep
      ledger_key: llama3-70b-64-fanin-sweep
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}

  aggregate-burst-sweep:
    name: Aggregate the microburst source-count sweep
    needs: [ evaluations, ledger ]
    if: ${{ always() }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/evaluation-aggregate.yml
    with:
      aggregate_name: Aggregate the microburst source-count sweep
      # The 32-direct arm is the 7-source point of the sweep; the brace set
      # keeps the sibling clrburst artifact out of the fold.
      download_pattern: ring-3d-llama3-70b-32-{direct,burst0,burst2,burst4}-comparison-summary-${{ github.run_id }}
      download_directory: runs/ring_3d/llama3_70b_32_burst/artifacts
      expected_count: 4
      command_prefix: uv run --locked python experiments/ring_3d/fan_in_sweep.py --swept-field microburst_source_count --comparison
      output_directory: runs/ring_3d/llama3_70b_32_burst/sweep
      report_file: fan_in_sweep_report.md
      artifact_name: ring-3d-llama3-70b-32-burst-sweep
      ledger_key: llama3-70b-32-burst-sweep
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}

  ledger-close:
    name: Finalize the experiment ledger
    if: ${{ always() }}
    needs:
    - ledger
    - python-quality
    - native-build
    - native-integration
    - archive-native-integration
    - cluster-build
    - archive-cluster-runtime
    - evaluations
    - aggregate-llama3-evaluation
    - aggregate-fanin-sweep
    - aggregate-burst-sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
    - name: Check out the ledger tool
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - name: Rebuild the index from the published sections and set the state
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.github/scripts
        LEDGER_ISSUE: ${{ needs.ledger.outputs.issue || 0 }}
        # A run that did not fully succeed leaves its record open, so the open
        # `experiment-ledger` issues are exactly the runs still owing attention.
        KEEP_OPEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: |
        set -euo pipefail
        arguments=(close --issue "$LEDGER_ISSUE")
        if [[ "$KEEP_OPEN" == "true" ]]; then
          arguments+=(--keep-open)
        fi
        python3 -m ci_ledger "${arguments[@]}"
