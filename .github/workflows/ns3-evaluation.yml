name: Reusable ns-3 evaluation

on:
  workflow_call:
    inputs:
      evaluation_name:
        description: >
          Human-readable name for the ledger entry. Job names are static:
          the caller's job is already named after the evaluation, and GitHub
          prefixes called jobs with it, so repeating it here only duplicated
          the prefix.
        required: true
        type: string
      profile:
        description: Repository-relative experiment profile.
        required: true
        type: string
      run_directory:
        description: Repository-relative directory for all generated inputs and results.
        required: true
        type: string
      artifact_name:
        description: Artifact prefix; the workflow appends the GitHub run ID.
        required: true
        type: string
      ledger_issue:
        description: Ledger issue number for the calling run; zero disables publication.
        required: false
        default: 0
        type: number
      ledger_key:
        description: Stable ledger section identity, reused across re-runs.
        required: true
        type: string
      release_tag:
        description: >
          Release tag from the calling run's `ledger` job; empty disables
          archiving. Never derived here — deriving it per job would split a
          partial re-run across two releases.
        required: false
        default: ''
        type: string
      comparison:
        description: Run a matched comparison instead of one structural experiment.
        required: true
        type: boolean
      comparison_seed:
        description: Optional single seed for one independently scheduled matched pair; zero runs the default seed set.
        required: false
        default: 0
        type: number
      execution_timeout_minutes:
        description: Wall-clock guard for the run or comparison command.
        required: true
        type: number
      simulation_timeout_seconds:
        description: Wall-clock cap for each ns-3 simulator process.
        required: true
        type: number
      require_congestion:
        description: Fail a paired evaluation without raw queue, PFC, and background-traffic evidence.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    name: Structural experiment
    if: ${{ !inputs.comparison }}
    runs-on: ubuntu-22.04
    # The reusable workflow owns a complete hosted job. Callers reserve their
    # simulator and wrapper budgets below the six-hour GitHub Actions limit.
    timeout-minutes: 360
    # This job runs the compiled simulator for hours. It holds no write scope
    # at all; every outward-facing effect happens in the `archive` job below.
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    # Builds its own backends through the shared compiler cache instead of
    # consuming the native-build artifact. Structural experiments run only
    # on dispatch, and paying a cached build here frees every evaluation
    # from gating on - and failing with - a build job whose artifact the
    # cluster path never used.
    - name: Build the native backends through the trusted compiler cache
      uses: ./.github/actions/native-build

    - name: Run structural ns-3 experiment
      env:
        EXECUTION_TIMEOUT_MINUTES: ${{ inputs.execution_timeout_minutes }}
        SIMULATION_TIMEOUT_SECONDS: ${{ inputs.simulation_timeout_seconds }}
      run: |
        timeout --foreground "${EXECUTION_TIMEOUT_MINUTES}m" \
          uv run --locked python experiments/ring_3d/run.py \
          --profile "$EXPERIMENT_PROFILE" \
          --output "$EXPERIMENT_RUN_DIRECTORY" \
          --simulation-timeout-seconds "$SIMULATION_TIMEOUT_SECONDS" \
          --clean

    - name: Publish structural researcher report
      if: ${{ always() }}
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile "$EXPERIMENT_PROFILE" \
          --run-dir "$EXPERIMENT_RUN_DIRECTORY" \
          --output "$EXPERIMENT_RUN_DIRECTORY/research_report.md"
        cat "$EXPERIMENT_RUN_DIRECTORY/research_report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true

  provision:
    name: Provision the cluster runner
    # Every paired comparison runs on the cluster: heavy pairs cannot finish
    # under the 6-hour hosted ceiling, and self-hosted jobs may run 5 days.
    if: ${{ inputs.comparison }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Authenticates with repository secrets, not the workflow token.
    permissions: {}

    steps:
    # An app installation token instead of a PAT: owned by the org rather
    # than a person, scoped to this one repository's Administration
    # permission, and valid for one hour - no standing credential exists.
    - name: Mint an installation token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.DCS_APP_ID }}
        private-key: ${{ secrets.DCS_APP_PRIVATE_KEY }}

    - name: Mint a just-in-time runner and hand it to SLURM
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        SSH_KEY: ${{ secrets.DCS_SSH_KEY }}
        SSH_DEST: ${{ vars.DCS_SSH_DEST }}
        SSH_HOST_KEY: ${{ vars.DCS_SSH_HOST_KEY }}
        RUNNER_NAME: dcs-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ledger_key }}
        # Also the exact label the companion evaluate_cluster job requires.
        # Pinning each runner to its own experiment keeps the assignment
        # 1:1 by construction - a runner can never pick up a concurrent
        # experiment's job - so a SLURM job id always maps to one known
        # Actions run, and per-experiment resource shapes stay possible.
        RUN_LABEL: dcs-r${{ github.run_id }}-${{ inputs.ledger_key }}
      run: |
        set -euo pipefail
        # A JIT config registers a runner that executes exactly one job and
        # then deregisters itself: runner lifetime equals experiment lifetime.
        jit="$(gh api -X POST \
          "repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig" \
          -f name="$RUNNER_NAME" -F runner_group_id=1 -f work_folder=_work \
          -f 'labels[]=dcs' -f "labels[]=${RUN_LABEL}" \
          --jq .encoded_jit_config)"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
        chmod 600 ~/.ssh/id_ci
        # Pinned host key: a man in the middle could otherwise capture the
        # JIT config and impersonate the runner for this one job.
        printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
        # The key is bound to a forced command on the cluster that reads a
        # jitconfig from stdin and submits one SLURM runner job. The command
        # word is never executed; the forced command sanitizes it and uses
        # it as the SLURM job name so squeue identifies the experiment.
        printf '%s' "$jit" | ssh -i ~/.ssh/id_ci -o BatchMode=yes \
          "$SSH_DEST" "$RUNNER_NAME"

  evaluate_cluster:
    name: Cluster comparison
    needs: provision
    if: ${{ inputs.comparison }}
    # The run-scoped label pins this job to the one runner its provision
    # job minted: concurrent experiments can never swap runners, so a SLURM
    # job id always identifies one Actions run. (A JIT registration carries
    # exactly the labels passed to generate-jitconfig - the implicit
    # self-hosted/Linux/X64 defaults of config.sh registration never exist.)
    runs-on: dcs-r${{ github.run_id }}-${{ inputs.ledger_key }}
    # Self-hosted jobs may run for 5 days; the SLURM walltime (4d20h) is the
    # effective bound. Comfortably above the ~10 h heavy arms need tripled.
    timeout-minutes: 6900
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        # The cluster builds its own binary against the rootless toolchain,
        # so it needs the full native tree.
        submodules: recursive
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env
      with:
        cache: 'false'

    - name: Build the ns-3 backend with the rootless toolchain
      run: bash ci/dcs/build.sh

    - name: Run the full paired comparison
      # Inputs cross into the shell as environment data, never as text
      # spliced into the script.
      env:
        EXECUTION_TIMEOUT_MINUTES: ${{ inputs.execution_timeout_minutes }}
        SIMULATION_TIMEOUT_SECONDS: ${{ inputs.simulation_timeout_seconds }}
        REQUIRE_CONGESTION: ${{ inputs.require_congestion }}
        COMPARISON_SEED: ${{ inputs.comparison_seed }}
      run: |
        command=(
          uv run --locked python experiments/ring_3d/compare.py
          --profile "$EXPERIMENT_PROFILE"
          --output "$EXPERIMENT_RUN_DIRECTORY"
          --simulation-timeout-seconds "$SIMULATION_TIMEOUT_SECONDS"
          --clean
        )
        if [[ "$REQUIRE_CONGESTION" == "true" ]]; then
          command+=(--require-congestion)
        fi
        if [[ "$COMPARISON_SEED" != "0" ]]; then
          command+=(--seeds "$COMPARISON_SEED")
        fi
        timeout --foreground "${EXECUTION_TIMEOUT_MINUTES}m" "${command[@]}"

    - name: Publish paired comparison report
      if: ${{ always() }}
      run: |
        if [[ -f "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" ]]; then
          cat "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Paired evaluation did not produce a comparison report; inspect the retained diagnostics." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true

  archive:
    name: Record the result
    needs: [ evaluate, evaluate_cluster ]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # The only job here that holds write scopes. It runs `gh` and `tar` over a
    # downloaded bundle and never executes anything from it, so a malicious
    # artifact cannot reach the token.
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the evaluation report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}

    - name: Persist the evaluation report in the ledger
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ inputs.ledger_issue }}
        key: ${{ inputs.ledger_key }}
        title: ${{ inputs.evaluation_name }}
        body-file: ${{ inputs.run_directory }}/${{ inputs.comparison && 'comparison_report.md' || 'research_report.md' }}
        # Exactly one of the two paths ran; report the status of that one.
        status: ${{ inputs.comparison && needs.evaluate_cluster.result || needs.evaluate.result }}

    - name: Archive the reproducibility bundle permanently
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ inputs.release_tag }}
        artifact: ${{ inputs.artifact_name }}-${{ github.run_id }}
        asset-name: ${{ inputs.artifact_name }}
