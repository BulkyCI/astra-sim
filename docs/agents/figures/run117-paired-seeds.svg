<text x="862" y="212" font-size="10.5" fill="#1e3a5f" font-weight="normal">  153 ms saved, CI [5, 302] ms</text>
<text x="862" y="226" font-size="10.5" fill="#1e3a5f" font-weight="normal"></text>
<text x="862" y="240" font-size="10.5" fill="#1e3a5f" font-weight="bold">13 of 16 seeds improve</text>
<rect x="850" y="248" width="212" height="132" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="862" y="270" font-size="12" font-weight="bold">The dose is the lever</text>
<text x="862" y="288" font-size="10.5" fill="#4b5563">Running 10 % on every step, with</text>
<text x="862" y="302" font-size="10.5" fill="#4b5563">no phase protection at all, buys</text>
<text x="862" y="316" font-size="10.5" fill="#4b5563">9.42 %, CI [7.03, 11.82] %.</text>
<text x="862" y="330" font-size="10.5" fill="#4b5563"></text>
<text x="862" y="344" font-size="10.5" fill="#4b5563">The phase bound gives up most of</text>
<text x="862" y="358" font-size="10.5" fill="#4b5563">that. It costs 242 ms across steps</text>
<text x="862" y="372" font-size="10.5" fill="#4b5563">1 to 3 and nothing at the tail.</text>
