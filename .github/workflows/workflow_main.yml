name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Setup
      run: ${{github.workspace}}/.github/workflows/setup.sh

    - name: Build
      run: ${{github.workspace}}/.github/workflows/build.sh

    - name: Test
      run: ${{github.workspace}}/.github/workflows/test.sh

