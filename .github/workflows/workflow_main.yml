name: CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python tooling and experiment tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Synchronize locked Python environment
      run: ./utils/setup.sh

    - name: Verify lockfile and tooling
      run: |
        uv lock --check
        uv run --locked python -m compileall -q experiments/ring_3d
        uv run --locked python -m unittest discover -s experiments/ring_3d/tests -v
        bash -n experiments/ring_3d/smoke.sh utils/setup.sh
        git diff --check

  native-integration:
    name: Native build, regression, and ns-3 smoke
    needs: python-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Restore trusted compiler cache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/astra-sim-ccache
        key: astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-${{ github.sha }}
        restore-keys: |
          astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-

    - name: Set compiler-cache paths
      run: |
        echo "CCACHE_DIR=$RUNNER_TEMP/astra-sim-ccache" >> "$GITHUB_ENV"
        echo "CCACHE_CONFIGPATH=$RUNNER_TEMP/astra-sim-ccache-config/ccache.conf" >> "$GITHUB_ENV"

    - name: Install native build dependencies
      run: ./.github/workflows/setup.sh

    - name: Configure compiler cache
      run: |
        install -d -m 700 "$CCACHE_DIR" "$(dirname "$CCACHE_CONFIGPATH")"
        : > "$CCACHE_CONFIGPATH"
        chmod 600 "$CCACHE_CONFIGPATH"
        ccache --set-config=cache_dir="$CCACHE_DIR"
        ccache --set-config=compiler_check=content
        ccache --set-config=compression=true
        ccache --set-config=max_size=1G
        ccache --set-config=sloppiness=
        ccache --zero-stats
        ccache --show-config

    - name: Build analytical and ns-3 backends
      run: bash ./.github/workflows/build.sh

    # Only branch pushes can publish cache entries. Pull-request code can read
    # trusted entries but never writes one that a protected branch can consume.
    - name: Save compiler cache from trusted pushes
      if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') && steps.ccache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/astra-sim-ccache
        key: astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-${{ github.sha }}

    - name: Report compiler-cache statistics
      if: always()
      run: |
        ccache --show-stats
        {
          echo '### Compiler cache'
          echo '```text'
          ccache --show-stats
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run analytical regression suite
      run: bash ./.github/workflows/test.sh

    - name: Run 3D Ring ns-3 smoke experiment
      run: timeout --foreground 5m bash ./experiments/ring_3d/smoke.sh

    - name: Generate Llama 3 70B-class bucket trace
      run: |
        uv run --locked python experiments/ring_3d/generate.py \
          --profile experiments/ring_3d/profiles/llama3_70b_16.json \
          --output runs/ring_3d/llama3_70b_16 --clean

    - name: Publish 3D Ring researcher report
      if: always()
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile experiments/ring_3d/profiles/smoke_8.json \
          --run-dir runs/ring_3d/smoke_8 \
          --output runs/ring_3d/smoke_8/research_report.md
        cat runs/ring_3d/smoke_8/research_report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload 3D Ring researcher report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ring-3d-research-report-${{ github.run_id }}
        path: runs/ring_3d/smoke_8/research_report.md
        if-no-files-found: error

    - name: Upload 3D Ring reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ring-3d-smoke-results-${{ github.run_id }}
        path: runs/ring_3d/smoke_8
        if-no-files-found: ignore

    - name: Upload Llama 3 70B-class bucket trace
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ring-3d-llama3-70b-16-trace-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16
        if-no-files-found: ignore

  paired-llama3-evaluation:
    name: Five-seed Llama 3 70B congestion evaluation
    needs: python-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Restore trusted compiler cache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/astra-sim-ccache
        key: astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-${{ github.sha }}
        restore-keys: |
          astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-

    - name: Set compiler-cache paths
      run: |
        echo "CCACHE_DIR=$RUNNER_TEMP/astra-sim-ccache" >> "$GITHUB_ENV"
        echo "CCACHE_CONFIGPATH=$RUNNER_TEMP/astra-sim-ccache-config/ccache.conf" >> "$GITHUB_ENV"

    - name: Install native build dependencies
      run: ./.github/workflows/setup.sh

    - name: Configure compiler cache
      run: |
        install -d -m 700 "$CCACHE_DIR" "$(dirname "$CCACHE_CONFIGPATH")"
        : > "$CCACHE_CONFIGPATH"
        chmod 600 "$CCACHE_CONFIGPATH"
        ccache --set-config=cache_dir="$CCACHE_DIR"
        ccache --set-config=compiler_check=content
        ccache --set-config=compression=true
        ccache --set-config=max_size=1G
        ccache --set-config=sloppiness=
        ccache --zero-stats
        ccache --show-config

    - name: Build analytical and ns-3 backends
      run: bash ./.github/workflows/build.sh

    # Only branch pushes can publish cache entries. Pull-request code can read
    # trusted entries but never writes one that a protected branch can consume.
    - name: Save compiler cache from trusted pushes
      if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') && steps.ccache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/astra-sim-ccache
        key: astra-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-gcc-11-${{ github.sha }}

    - name: Report compiler-cache statistics
      if: always()
      run: |
        ccache --show-stats
        {
          echo '### Compiler cache'
          echo '```text'
          ccache --show-stats
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run five-seed paired Llama 3 70B comparison
      run: |
        timeout --foreground 160m uv run --locked python experiments/ring_3d/compare.py \
          --profile experiments/ring_3d/profiles/llama3_70b_16.json \
          --output runs/ring_3d/llama3_70b_16_comparison \
          --simulation-timeout-seconds 960 \
          --require-congestion --clean

    - name: Publish paired comparison report
      if: always()
      run: |
        if [[ -f runs/ring_3d/llama3_70b_16_comparison/comparison_report.md ]]; then
          cat runs/ring_3d/llama3_70b_16_comparison/comparison_report.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Paired Llama 3 70B comparison did not produce a report; inspect retained diagnostics." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload paired Llama 3 70B reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ring-3d-llama3-70b-16-comparison-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16_comparison
        if-no-files-found: ignore

