<text x="862" y="142" font-size="10.5" fill="#1e3a5f" font-weight="normal">  7145 ms to 6854 ms</text>
<text x="862" y="156" font-size="10.5" fill="#1e3a5f" font-weight="bold">  3.91 %, 95 % CI [1.13, 6.68] %</text>
