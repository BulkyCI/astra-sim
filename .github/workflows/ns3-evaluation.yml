name: Reusable ns-3 evaluation

on:
  workflow_call:
    inputs:
      evaluation_name:
        description: Human-readable evaluation name.
        required: true
        type: string
      profile:
        description: Repository-relative experiment profile.
        required: true
        type: string
      run_directory:
        description: Repository-relative directory for all generated inputs and results.
        required: true
        type: string
      artifact_name:
        description: Artifact prefix; the workflow appends the GitHub run ID.
        required: true
        type: string
      ledger_issue:
        description: Ledger issue number for the calling run; zero disables publication.
        required: false
        default: 0
        type: number
      ledger_key:
        description: Stable ledger section identity, reused across re-runs.
        required: true
        type: string
      runtime_artifact:
        description: >
          Artifact name published by the caller's `native-build` job. Passed in
          so producer and consumer share one definition site.
        required: true
        type: string
      release_tag:
        description: >
          Release tag from the calling run's `ledger` job; empty disables
          archiving. Never derived here — deriving it per job would split a
          partial re-run across two releases.
        required: false
        default: ''
        type: string
      comparison:
        description: Run a matched comparison instead of one structural experiment.
        required: true
        type: boolean
      comparison_seed:
        description: Optional single seed for one independently scheduled matched pair; zero runs the default seed set.
        required: false
        default: 0
        type: number
      execution_timeout_minutes:
        description: Wall-clock guard for the run or comparison command.
        required: true
        type: number
      simulation_timeout_seconds:
        description: Wall-clock cap for each ns-3 simulator process.
        required: true
        type: number
      require_congestion:
        description: Fail a paired evaluation without raw queue, PFC, and background-traffic evidence.
        required: true
        type: boolean
      runs_on:
        description: >
          Where a paired comparison executes. `hosted` chains one GitHub-hosted
          job per arm to stay under the 6-hour hosted ceiling; `dcs` provisions
          one just-in-time SLURM runner on the DCS cluster and runs the whole
          comparison as a single job, which self-hosted limits allow up to
          5 days.
        required: false
        default: hosted
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ inputs.evaluation_name }}
    if: ${{ !inputs.comparison }}
    runs-on: ubuntu-22.04
    # The reusable workflow owns a complete hosted job. Callers reserve their
    # simulator and wrapper budgets below the six-hour GitHub Actions limit.
    timeout-minutes: 360
    # This job runs the compiled simulator for hours. It holds no write scope
    # at all; every outward-facing effect happens in the `archive` job below.
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # The prebuilt runtime replaces the native tree, so the expensive
        # recursive ns-3 clone is not needed here.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Unpack the native runtime built once for this run
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ inputs.runtime_artifact }}

    - name: Run structural ns-3 experiment
      run: |
        timeout --foreground ${{ inputs.execution_timeout_minutes }}m \
          uv run --locked python experiments/ring_3d/run.py \
          --profile "$EXPERIMENT_PROFILE" \
          --output "$EXPERIMENT_RUN_DIRECTORY" \
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }} \
          --clean

    - name: Publish structural researcher report
      if: ${{ always() }}
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile "$EXPERIMENT_PROFILE" \
          --run-dir "$EXPERIMENT_RUN_DIRECTORY" \
          --output "$EXPERIMENT_RUN_DIRECTORY/research_report.md"
        cat "$EXPERIMENT_RUN_DIRECTORY/research_report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true

  arm:
    name: ${{ inputs.evaluation_name }} (${{ matrix.arm }})
    if: ${{ inputs.comparison && inputs.runs_on == 'hosted' }}
    runs-on: ubuntu-22.04
    # Each arm owns a complete hosted job, so the six-hour ceiling and the
    # caller's execution guard bound one arm rather than the whole triple.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      # Sequential by design: the account-wide concurrent-job limit is the
      # scarce resource, and the matrix caller already fills it with one job
      # per evaluation pair. One arm at a time keeps this workflow's runner
      # footprint identical to the single-job version it replaced.
      max-parallel: 1
      fail-fast: true
      matrix:
        arm: [ fixed_p_low_baseline, fixed_p_high_baseline, dblp_policy ]
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Unpack the native runtime built once for this run
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ inputs.runtime_artifact }}

    - name: Run one comparison arm
      # The vitals loop exists because two hosted runners died with "lost
      # communication with the server" 3.5-4 h into heavy arms while the
      # simulator's own resident set was flat: whatever kills the VM is
      # invisible from inside the process. A once-a-minute line in the live
      # job log shows whole-VM memory, root-disk space, and load right up to
      # the moment of death, so the next death either names the exhausted
      # resource or proves the VM was healthy when the host pulled the plug.
      # It shares this step because a background process that outlives its
      # step keeps the step's stdout pipe open and hangs the job; here it is
      # killed before the script exits.
      run: |
        (while sleep 60; do
          echo "vitals $(date -u +%H:%M:%S)" \
            "$(free -m | awk '/^Mem:/{printf "mem_used_mb=%s mem_avail_mb=%s", $3, $7}')" \
            "root_avail_mb=$(df -m --output=avail / | tail -1 | tr -d ' ')" \
            "load=$(cut -d' ' -f1 /proc/loadavg)"
        done) &
        vitals_pid=$!
        command=(
          uv run --locked python experiments/ring_3d/compare.py
          --profile "$EXPERIMENT_PROFILE"
          --output "$EXPERIMENT_RUN_DIRECTORY"
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }}
          --arm ${{ matrix.arm }}
        )
        if [[ "${{ inputs.require_congestion }}" == "true" ]]; then
          command+=(--require-congestion)
        fi
        if [[ "${{ inputs.comparison_seed }}" != "0" ]]; then
          command+=(--seeds ${{ inputs.comparison_seed }})
        fi
        status=0
        timeout --foreground ${{ inputs.execution_timeout_minutes }}m \
          "${command[@]}" || status=$?
        kill "$vitals_pid" 2>/dev/null || true
        exit "$status"

    - name: Upload the arm's telemetry for the analyze job
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # The run ID sits before the arm suffix so the aggregation globs,
        # which anchor on `-<run id>` at the end, can never match these
        # intermediates.
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}-arm-${{ matrix.arm }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true
        # Intermediate: the analyze job folds these into the durable bundle.
        retention-days: 1

  analyze:
    name: Compare ${{ inputs.evaluation_name }}
    needs: arm
    # Runs even when an arm failed: it fails fast on the missing summary and
    # carries the failure into the ledger status, while whatever arm
    # telemetry did upload is preserved for diagnosis.
    if: ${{ !cancelled() && inputs.comparison && inputs.runs_on == 'hosted' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Collect the arm telemetry
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.artifact_name }}-${{ github.run_id }}-arm-*
        path: ${{ inputs.run_directory }}
        merge-multiple: true

    - name: Build the comparison from the completed arms
      run: |
        command=(
          uv run --locked python experiments/ring_3d/compare.py
          --profile "$EXPERIMENT_PROFILE"
          --output "$EXPERIMENT_RUN_DIRECTORY"
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }}
          --analyze-only
        )
        if [[ "${{ inputs.require_congestion }}" == "true" ]]; then
          command+=(--require-congestion)
        fi
        if [[ "${{ inputs.comparison_seed }}" != "0" ]]; then
          command+=(--seeds ${{ inputs.comparison_seed }})
        fi
        "${command[@]}"

    - name: Publish paired comparison report
      if: ${{ always() }}
      run: |
        if [[ -f "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" ]]; then
          cat "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Paired evaluation did not produce a comparison report; inspect the retained diagnostics." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true

  provision:
    name: Provision a DCS runner for ${{ inputs.evaluation_name }}
    if: ${{ inputs.comparison && inputs.runs_on == 'dcs' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Authenticates with repository secrets, not the workflow token.
    permissions: {}

    steps:
    # An app installation token instead of a PAT: owned by the org rather
    # than a person, scoped to this one repository's Administration
    # permission, and valid for one hour - no standing credential exists.
    - name: Mint an installation token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.DCS_APP_ID }}
        private-key: ${{ secrets.DCS_APP_PRIVATE_KEY }}

    - name: Mint a just-in-time runner and hand it to SLURM
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        SSH_KEY: ${{ secrets.DCS_SSH_KEY }}
        SSH_DEST: ${{ vars.DCS_SSH_DEST }}
        SSH_HOST_KEY: ${{ vars.DCS_SSH_HOST_KEY }}
        RUNNER_NAME: dcs-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ledger_key }}
      run: |
        set -euo pipefail
        # A JIT config registers a runner that executes exactly one job and
        # then deregisters itself: runner lifetime equals experiment lifetime.
        jit="$(gh api -X POST \
          "repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig" \
          -f name="$RUNNER_NAME" -F runner_group_id=1 -f work_folder=_work \
          -f 'labels[]=dcs' --jq .encoded_jit_config)"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
        chmod 600 ~/.ssh/id_ci
        # Pinned host key: a man in the middle could otherwise capture the
        # JIT config and impersonate the runner for this one job.
        printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
        # The key is bound to a forced command on the cluster that reads a
        # jitconfig from stdin and submits one SLURM runner job. The command
        # word is never executed; the forced command sanitizes it and uses
        # it as the SLURM job name so squeue identifies the experiment.
        printf '%s' "$jit" | ssh -i ~/.ssh/id_ci -o BatchMode=yes \
          "$SSH_DEST" "$RUNNER_NAME"

  evaluate_cluster:
    name: ${{ inputs.evaluation_name }} (cluster)
    needs: provision
    if: ${{ inputs.comparison && inputs.runs_on == 'dcs' }}
    # Only the custom label: a JIT registration carries exactly the labels
    # passed to generate-jitconfig, so the implicit self-hosted/Linux/X64
    # defaults that config.sh-registered runners self-report never exist.
    runs-on: dcs
    # Self-hosted jobs may run for 5 days; the SLURM walltime (4d20h) is the
    # effective bound. Comfortably above the ~10 h heavy arms need tripled.
    timeout-minutes: 6900
    permissions:
      contents: read
    env:
      EXPERIMENT_PROFILE: ${{ inputs.profile }}
      EXPERIMENT_RUN_DIRECTORY: ${{ inputs.run_directory }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        # The cluster builds its own binary against the rootless toolchain,
        # so it needs the full native tree.
        submodules: recursive
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env
      with:
        cache: 'false'

    - name: Build the ns-3 backend with the rootless toolchain
      run: bash ci/dcs/build.sh

    - name: Run the full paired comparison
      run: |
        command=(
          uv run --locked python experiments/ring_3d/compare.py
          --profile "$EXPERIMENT_PROFILE"
          --output "$EXPERIMENT_RUN_DIRECTORY"
          --simulation-timeout-seconds ${{ inputs.simulation_timeout_seconds }}
          --clean
        )
        if [[ "${{ inputs.require_congestion }}" == "true" ]]; then
          command+=(--require-congestion)
        fi
        if [[ "${{ inputs.comparison_seed }}" != "0" ]]; then
          command+=(--seeds ${{ inputs.comparison_seed }})
        fi
        timeout --foreground ${{ inputs.execution_timeout_minutes }}m "${command[@]}"

    - name: Publish paired comparison report
      if: ${{ always() }}
      run: |
        if [[ -f "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" ]]; then
          cat "$EXPERIMENT_RUN_DIRECTORY/comparison_report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Paired evaluation did not produce a comparison report; inspect the retained diagnostics." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}
        if-no-files-found: ignore
        overwrite: true

  archive:
    name: Record ${{ inputs.evaluation_name }}
    needs: [ evaluate, analyze, evaluate_cluster ]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # The only job here that holds write scopes. It runs `gh` and `tar` over a
    # downloaded bundle and never executes anything from it, so a malicious
    # artifact cannot reach the token.
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the evaluation report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}-${{ github.run_id }}
        path: ${{ inputs.run_directory }}

    - name: Persist the evaluation report in the ledger
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ inputs.ledger_issue }}
        key: ${{ inputs.ledger_key }}
        title: ${{ inputs.evaluation_name }}
        body-file: ${{ inputs.run_directory }}/${{ inputs.comparison && 'comparison_report.md' || 'research_report.md' }}
        # Exactly one of the three paths ran; report the status of that one.
        status: ${{ inputs.comparison && (inputs.runs_on == 'dcs' && needs.evaluate_cluster.result || needs.analyze.result) || needs.evaluate.result }}

    - name: Archive the reproducibility bundle permanently
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ inputs.release_tag }}
        artifact: ${{ inputs.artifact_name }}-${{ github.run_id }}
        asset-name: ${{ inputs.artifact_name }}
