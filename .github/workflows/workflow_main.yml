name: CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:
    inputs:
      run_structural_studies:
        description: Run 100B structural topology studies
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A push is an independent experiment whose record must survive, so its group
  # is unique per run and no earlier run is ever cancelled. A pull-request run
  # is an iteration of a proposal rather than an experiment, so a newer push to
  # the same head supersedes the previous attempt and reclaims the runners.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ledger:
    name: Open the experiment ledger
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Opens the run's release as well as its issue, so it needs contents:write.
    # It runs only `gh` and finishes in under a minute.
    permissions:
      contents: write
      issues: write
    outputs:
      # `0` is the disabled ledger. Emitting it unconditionally keeps every
      # downstream `needs:` edge live; a skipped job would silently skip the
      # whole graph behind it.
      issue: ${{ steps.open.outputs.issue || 0 }}
      # The run's identity, evaluated exactly once. Everything downstream takes
      # it as an opaque value; recomputing it per job would split a partial
      # re-run across two releases.
      release_tag: ${{ steps.open.outputs.release_tag }}
    steps:
    - name: Check out the ledger tool
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - name: Open the run's ledger issue and permanent archive
      id: open
      # A fork pull request holds a read-only token, and a proposal is not an
      # experiment; those runs are recorded by artifacts and the run summary.
      if: ${{ github.event_name != 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.github/scripts
      run: python3 -m ci_ledger open

  python-quality:
    name: Python tooling and experiment tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # This job never touches the native tree. Skipping the recursive
        # submodule fetch removes the ns-3 clone from the critical path.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Verify lockfile and tooling
      run: |
        uv lock --check
        uv run --locked python -m compileall -q experiments/ring_3d experiments/dblp .github/scripts
        uv run --locked python -m unittest discover -s experiments/ring_3d/tests -v
        uv run --locked python -m unittest discover -s experiments/dblp/tests -v
        uv run --locked python -m unittest discover -s .github/scripts/tests -t .github/scripts -v
        bash -n experiments/ring_3d/smoke.sh experiments/ring_3d/failure_liveness.sh experiments/dblp/smoke.sh utils/setup.sh .github/workflows/setup.sh
        git diff --check

  native-build:
    name: Build the native backends once
    needs: python-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      # One definition site for the name, the same discipline the ledger issue
      # and release tag follow. Producer and consumer cannot drift apart.
      runtime_artifact: native-runtime-${{ github.run_id }}

    steps:
    - name: Check out source and submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Build the native backends through the trusted compiler cache
      uses: ./.github/actions/native-build

    - name: Package the native runtime
      run: |
        set -euo pipefail
        # tar preserves the executable bit and the analytical build's symlinks;
        # the artifact uploader's own zip does not.
        tar -czf native-runtime.tar.gz \
          extern/network_backend/ns-3/build \
          build/astra_analytical/build
        ls -l native-runtime.tar.gz

    - name: Upload the native runtime
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('native-runtime-{0}', github.run_id) }}
        path: native-runtime.tar.gz
        # Already gzipped; re-compressing costs minutes and saves nothing.
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

  native-integration:
    name: Analytical regression and ns-3 smoke
    needs: native-build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Runs compiled simulator code, so it holds no write scope. Recording
    # happens in archive-native-integration.
    permissions:
      contents: read

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        # The prebuilt runtime replaces the native tree, so the expensive
        # recursive ns-3 clone is not needed here.
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Unpack the native runtime built once for this run
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ needs.native-build.outputs.runtime_artifact }}

    - name: Run analytical regression suite
      run: bash ./.github/workflows/test.sh

    - name: Run 3D Ring ns-3 smoke experiment
      run: timeout --foreground 5m bash ./experiments/ring_3d/smoke.sh

    - name: Verify 3D Ring retry-exhaustion telemetry
      run: timeout --foreground 2m bash ./experiments/ring_3d/failure_liveness.sh

    - name: Verify separate DBLP injected-loss profile
      run: timeout --foreground 2m bash ./experiments/dblp/smoke.sh

    - name: Generate Llama 3 70B-class bucket trace
      run: |
        uv run --locked python experiments/ring_3d/generate.py \
          --profile experiments/ring_3d/profiles/llama3_70b_16.json \
          --output runs/ring_3d/llama3_70b_16 --clean

    - name: Publish 3D Ring researcher report
      if: always()
      run: |
        uv run --locked python experiments/ring_3d/report.py \
          --profile experiments/ring_3d/profiles/smoke_8.json \
          --run-dir runs/ring_3d/smoke_8 \
          --output runs/ring_3d/smoke_8/research_report.md
        cat runs/ring_3d/smoke_8/research_report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload 3D Ring researcher report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-research-report-${{ github.run_id }}
        path: runs/ring_3d/smoke_8/research_report.md
        if-no-files-found: error

    - name: Upload 3D Ring reproducibility bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-smoke-results-${{ github.run_id }}
        path: runs/ring_3d/smoke_8
        if-no-files-found: ignore

    - name: Upload 3D Ring retry-exhaustion bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-retry-exhaustion-${{ github.run_id }}
        path: runs/ring_3d/retry_exhaustion_8
        if-no-files-found: ignore

    - name: Upload Llama 3 70B-class bucket trace
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-llama3-70b-16-trace-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16
        if-no-files-found: ignore

  archive-native-integration:
    name: Record the analytical regression and ns-3 smoke
    needs: [ native-integration, ledger ]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # A sink job: the only place a write scope exists for this branch of the
    # graph. It runs `gh` and `tar` over downloaded bundles and executes
    # nothing from them.
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the researcher report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ring-3d-research-report-${{ github.run_id }}
        path: runs/ring_3d/smoke_8

    - name: Persist the 3D Ring researcher report
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ needs.ledger.outputs.issue }}
        key: native-integration
        title: Analytical regression and ns-3 smoke
        body-file: runs/ring_3d/smoke_8/research_report.md
        status: ${{ needs.native-integration.result }}

    - name: Archive the 3D Ring smoke bundle
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-smoke-results-${{ github.run_id }}
        asset-name: ring-3d-smoke-results

    - name: Archive the retry-exhaustion bundle
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-retry-exhaustion-${{ github.run_id }}
        asset-name: ring-3d-retry-exhaustion

    - name: Archive the Llama 3 70B-class bucket trace
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-llama3-70b-16-trace-${{ github.run_id }}
        asset-name: ring-3d-llama3-70b-16-trace

  paired-llama3-evaluation:
    name: Llama 3 70B congestion pair (seed ${{ matrix.seed }})
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow, not a grant to the simulator. Permissions
    # can only be reduced down the chain, and ns3-evaluation.yml's `evaluate`
    # job declares `contents: read`; only its `archive` job takes the write.
    permissions:
      contents: write
      issues: write
    strategy:
      fail-fast: false
      # Equal to the matrix size, so this currently constrains nothing; it
      # takes effect only if seeds are added. The real budget is the account
      # limit of 20 concurrent jobs on Free (40 on Pro), shared across every
      # repository in the account:
      # https://docs.github.com/en/actions/reference/limits
      max-parallel: 5
      matrix:
        # Consecutive nine-digit chunks of π's decimal expansion. They are
        # deterministic for reproducibility and portable 32-bit seed values.
        seed: [314159265, 358979323, 846264338, 327950288, 419716939]
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: Llama 3 70B congestion pair (seed ${{ matrix.seed }})
      profile: experiments/ring_3d/profiles/llama3_70b_16.json
      run_directory: runs/ring_3d/llama3_70b_16_comparison/seed_${{ matrix.seed }}
      artifact_name: ring-3d-llama3-70b-16-comparison-seed-${{ matrix.seed }}
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: llama3-70b-16-seed-${{ matrix.seed }}
      comparison: true
      comparison_seed: ${{ matrix.seed }}
      execution_timeout_minutes: 330
      simulation_timeout_seconds: 9000
      require_congestion: true

  llama3-70b-32-direct-incast:
    name: Llama 3 70B 32-rank direct-DP incast pair
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow; its `evaluate` job reduces to read-only.
    permissions:
      contents: write
      issues: write
    # Phase-1 proof point: with dp=4 and the direct all-reduce override, every
    # DP rank receives dp-1 concurrent gradient shards through the spine, so
    # incast is organic to the workload instead of injected. One seed decides
    # whether the congestion knee responds before the fan-in matrix is built.
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: Llama 3 70B 32-rank direct-DP incast pair
      profile: experiments/ring_3d/profiles/llama3_70b_32_direct.json
      run_directory: runs/ring_3d/llama3_70b_32_direct_comparison
      artifact_name: ring-3d-llama3-70b-32-direct-comparison
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: llama3-70b-32-direct
      comparison: true
      comparison_seed: 314159265
      # Roughly twice the 16-rank arm's traffic (double the TP groups plus
      # direct DP exchange), so it shares that job's per-simulator backstop.
      execution_timeout_minutes: 330
      simulation_timeout_seconds: 9000
      require_congestion: true

  llama3-70b-64-fanin-sweep:
    name: Llama 3 70B 64-rank fan-in ${{ matrix.window }} pair
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow; its `evaluate` job reduces to read-only.
    permissions:
      contents: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # direct<k> caps concurrent peer transfers at k, so with dp=8 these
        # four windows sweep receiver fan-in {1, 2, 4, 7} on identical
        # hardware, traces, seed, and schedule: transport concurrency is the
        # only variable. The knee table reads congestion against this axis.
        window: [direct1, direct2, direct4, direct]
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: Llama 3 70B 64-rank fan-in ${{ matrix.window }} pair
      profile: experiments/ring_3d/profiles/llama3_70b_64_${{ matrix.window }}.json
      run_directory: runs/ring_3d/llama3_70b_64_fanin/${{ matrix.window }}
      artifact_name: ring-3d-llama3-70b-64-fanin-${{ matrix.window }}-comparison
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: llama3-70b-64-fanin-${{ matrix.window }}
      comparison: true
      comparison_seed: 314159265
      # 64 ranks move roughly four times the 16-rank arm's bytes, so the
      # per-arm backstop grows to 4 h while the pair stays inside the 5.5 h
      # wrapper and GitHub's 6 h job ceiling.
      execution_timeout_minutes: 330
      simulation_timeout_seconds: 14400
      require_congestion: true

  aggregate-fanin-sweep:
    name: Aggregate the DP fan-in sweep
    needs: llama3-70b-64-fanin-sweep
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Download fan-in point artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: ring-3d-llama3-70b-64-fanin-*-comparison-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_64_fanin/artifacts

    - name: Order the points by fan-in and render the knee table
      run: |
        mapfile -t comparisons < <(
          find runs/ring_3d/llama3_70b_64_fanin/artifacts \
            -name comparison.json -type f -print | sort
        )
        [[ "${#comparisons[@]}" -eq 4 ]]
        uv run --locked python experiments/ring_3d/fan_in_sweep.py \
          --comparison "${comparisons[@]}" \
          --output runs/ring_3d/llama3_70b_64_fanin/sweep
        cat runs/ring_3d/llama3_70b_64_fanin/sweep/fan_in_sweep_report.md \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the sweep table
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-llama3-70b-64-fanin-sweep-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_64_fanin/sweep
        if-no-files-found: ignore

  archive-fanin-sweep:
    name: Record the DP fan-in sweep
    needs: [ aggregate-fanin-sweep, ledger ]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the sweep table
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ring-3d-llama3-70b-64-fanin-sweep-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_64_fanin/sweep

    - name: Persist the sweep report
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ needs.ledger.outputs.issue }}
        key: llama3-70b-64-fanin-sweep
        title: Aggregate the DP fan-in sweep
        body-file: runs/ring_3d/llama3_70b_64_fanin/sweep/fan_in_sweep_report.md
        status: ${{ needs.aggregate-fanin-sweep.result }}

    - name: Archive the sweep bundle
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-llama3-70b-64-fanin-sweep-${{ github.run_id }}
        asset-name: ring-3d-llama3-70b-64-fanin-sweep

  historical-phase1-native-reference:
    name: Historical Phase-1 64-rank native reference pair
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow; its `evaluate` job reduces to read-only.
    permissions:
      contents: write
      issues: write
    # This independent, communication-only reference pair deliberately runs
    # alongside the Llama congestion matrix. Its profile reproduces the old
    # 64-rank/186-round trace shape, so it has the same six-hour budget as one
    # Llama pair but no background-incast gate.
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: Historical Phase-1 64-rank native reference pair
      profile: experiments/ring_3d/profiles/dblp_phase1_effnet_64dp.json
      run_directory: runs/ring_3d/dblp_phase1_effnet_64dp_comparison
      artifact_name: ring-3d-dblp-phase1-effnet-64dp-comparison
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: dblp-phase1-effnet-64dp
      comparison: true
      comparison_seed: 314159265
      # One arm of this pair measured 2.75 h of wall clock at 5.999M queue
      # pairs. The per-simulator cap is twice a conservative 3 h round-up, so
      # it is a backstop rather than a limit: a hung run is now caught by the
      # simulator's own liveness stall detector, which stops and flushes
      # telemetry instead of dying mid-flight with nothing to analyze. The
      # wrapper takes the whole job minus setup and archiving.
      execution_timeout_minutes: 350
      simulation_timeout_seconds: 21600
      require_congestion: false

  aggregate-llama3-evaluation:
    name: Aggregate five-seed Llama 3 70B congestion evaluation
    needs: paired-llama3-evaluation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        submodules: false
        persist-credentials: false

    - name: Set up the locked Python environment
      uses: ./.github/actions/python-env

    - name: Download paired seed artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: ring-3d-llama3-70b-16-comparison-seed-*-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16_comparison/artifacts

    - name: Validate and aggregate paired seed results
      run: |
        mapfile -t comparisons < <(
          find runs/ring_3d/llama3_70b_16_comparison/artifacts \
            -name comparison.json -type f -print | sort
        )
        [[ "${#comparisons[@]}" -eq 5 ]]
        uv run --locked python experiments/ring_3d/compare.py \
          --aggregate-inputs "${comparisons[@]}" \
          --output runs/ring_3d/llama3_70b_16_comparison/aggregate \
          --clean
        cat runs/ring_3d/llama3_70b_16_comparison/aggregate/comparison_report.md \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload aggregate comparison report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ring-3d-llama3-70b-16-comparison-aggregate-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16_comparison/aggregate
        if-no-files-found: ignore

  archive-aggregate-llama3-evaluation:
    name: Record the five-seed aggregate evaluation
    needs: [ aggregate-llama3-evaluation, ledger ]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out the publishing tools
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/actions
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Fetch the aggregate report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ring-3d-llama3-70b-16-comparison-aggregate-${{ github.run_id }}
        path: runs/ring_3d/llama3_70b_16_comparison/aggregate

    - name: Persist the aggregate comparison report
      uses: ./.github/actions/ledger-publish
      with:
        issue: ${{ needs.ledger.outputs.issue }}
        key: llama3-70b-16-aggregate
        title: Aggregate five-seed Llama 3 70B congestion evaluation
        body-file: runs/ring_3d/llama3_70b_16_comparison/aggregate/comparison_report.md
        status: ${{ needs.aggregate-llama3-evaluation.result }}

    - name: Archive the aggregate bundle
      uses: ./.github/actions/release-archive
      with:
        tag: ${{ needs.ledger.outputs.release_tag }}
        artifact: ring-3d-llama3-70b-16-comparison-aggregate-${{ github.run_id }}
        asset-name: ring-3d-llama3-70b-16-comparison-aggregate

  model-100b-256-clos-evaluation:
    name: 100B 256-card Clos structural evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_structural_studies }}
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow; its `evaluate` job reduces to read-only.
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: 100B 256-card Clos structural evaluation
      profile: experiments/ring_3d/profiles/model_100b_256_clos.json
      run_directory: runs/ring_3d/model_100b_256_clos
      artifact_name: ring-3d-model-100b-256-clos
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: model-100b-256-clos
      comparison: false
      execution_timeout_minutes: 320
      simulation_timeout_seconds: 16200
      require_congestion: false

  model-100b-256-ring-evaluation:
    name: 100B 256-card Ring structural evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_structural_studies }}
    needs: [ native-build, ledger ]
    # Ceiling for the called workflow; its `evaluate` job reduces to read-only.
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/ns3-evaluation.yml
    with:
      evaluation_name: 100B 256-card Ring structural evaluation
      profile: experiments/ring_3d/profiles/model_100b_256_ring.json
      run_directory: runs/ring_3d/model_100b_256_ring
      artifact_name: ring-3d-model-100b-256-ring
      ledger_issue: ${{ fromJSON(needs.ledger.outputs.issue || '0') }}
      release_tag: ${{ needs.ledger.outputs.release_tag }}
      runtime_artifact: ${{ needs.native-build.outputs.runtime_artifact }}
      ledger_key: model-100b-256-ring
      comparison: false
      execution_timeout_minutes: 320
      simulation_timeout_seconds: 16200
      require_congestion: false

  ledger-close:
    name: Finalize the experiment ledger
    if: ${{ always() }}
    needs:
    - ledger
    - python-quality
    - native-build
    - native-integration
    - archive-native-integration
    - paired-llama3-evaluation
    - llama3-70b-32-direct-incast
    - llama3-70b-64-fanin-sweep
    - aggregate-fanin-sweep
    - archive-fanin-sweep
    - historical-phase1-native-reference
    - aggregate-llama3-evaluation
    - archive-aggregate-llama3-evaluation
    - model-100b-256-clos-evaluation
    - model-100b-256-ring-evaluation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
    - name: Check out the ledger tool
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - name: Rebuild the index from the published sections and set the state
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.github/scripts
        LEDGER_ISSUE: ${{ needs.ledger.outputs.issue || 0 }}
        # A run that did not fully succeed leaves its record open, so the open
        # `experiment-ledger` issues are exactly the runs still owing attention.
        KEEP_OPEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: |
        set -euo pipefail
        arguments=(close --issue "$LEDGER_ISSUE")
        if [[ "$KEEP_OPEN" == "true" ]]; then
          arguments+=(--keep-open)
        fi
        python3 -m ci_ledger "${arguments[@]}"
