<text x="20" y="26" font-size="15" font-weight="bold">Run #120: the regime map. Where does an overloaded fabric actually hurt?</text>
<text x="20" y="46" font-size="11" fill="#4b5563">64 ranks, 20 steps, selective repeat, UEC trimming. Eight cells: congestion control off or DCQCN, DP fan-in 2 or 7, spine oversubscription 2:1 or 4:1.</text>
