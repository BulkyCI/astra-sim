<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="1080" height="470" fill="white"/>
<defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#374151"/></marker></defs>
<text x="20" y="26" font-size="15" font-weight="bold">FORGIVE: one flag at the sender, one verdict at the receiver, no change on the wire</text>
<rect x="60" y="70" width="220" height="88" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
<text x="170" y="92" text-anchor="middle" font-weight="bold" font-size="12.5">Sender NIC</text>
<text x="170" y="110" text-anchor="middle" font-size="10.5" fill="#4b5563">queue pair carries</text>
<text x="170" y="125" text-anchor="middle" font-size="10.5" fill="#4b5563">one exemption bit</text>
<rect x="430" y="70" width="220" height="88" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
<text x="540" y="92" text-anchor="middle" font-weight="bold" font-size="12.5">Switch</text>
<text x="540" y="110" text-anchor="middle" font-size="10.5" fill="#4b5563">trims the payload,</text>
<text x="540" y="125" text-anchor="middle" font-size="10.5" fill="#4b5563">forwards the header</text>
<rect x="800" y="70" width="220" height="88" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
<text x="910" y="92" text-anchor="middle" font-weight="bold" font-size="12.5">Receiver NIC</text>
<text x="910" y="110" text-anchor="middle" font-size="10.5" fill="#4b5563">keeps the byte ranges it</text>
<text x="910" y="125" text-anchor="middle" font-size="10.5" fill="#4b5563">already tracks for</text>
<text x="910" y="140" text-anchor="middle" font-size="10.5" fill="#4b5563">selective repeat</text>
<line x1="280" y1="100" x2="424" y2="100" stroke="#374151" marker-end="url(#a2)"/>
<text x="352" y="92" text-anchor="middle" font-size="10">data</text>
<line x1="650" y1="100" x2="794" y2="100" stroke="#374151" marker-end="url(#a2)"/>
<text x="722" y="92" text-anchor="middle" font-size="10">trimmed header</text>
<line x1="794" y1="134" x2="286" y2="134" stroke="#b91c1c" marker-end="url(#a2)"/>
<text x="540" y="150" text-anchor="middle" font-size="10.5" fill="#b91c1c">a repair request, or an acknowledgement of a range that never arrived</text>
<circle cx="42" cy="196" r="12" fill="#1d4ed8"/>
<text x="42" y="200" text-anchor="middle" fill="white" font-weight="bold" font-size="12">1</text>
<text x="66" y="201" font-weight="bold" font-size="12.5">The receiver, not the sender, decides.</text>
<text x="66" y="221" font-size="11" fill="#4b5563">On each trimmed range it asks whether this (rank, step) still has budget. If it does, the receiver acknowledges the</text>
<text x="66" y="237" font-size="11" fill="#4b5563">range as if it had been delivered and those bytes are gone for good. If it does not, it sends the ordinary repair</text>
<text x="66" y="253" font-size="11" fill="#4b5563">request.</text>
<circle cx="42" cy="284" r="12" fill="#1d4ed8"/>
<text x="42" y="288" text-anchor="middle" fill="white" font-weight="bold" font-size="12">2</text>
<text x="66" y="289" font-weight="bold" font-size="12.5">The budget is a ledger, not a coin flip.</text>
<text x="66" y="309" font-size="11" fill="#4b5563">forgiven(dst, step) + shed(dst, step) is bounded by p(step) x eligible(dst, step). Counters only grow, and the entry</text>
<text x="66" y="325" font-size="11" fill="#4b5563">closes when that rank finishes the step. Critical steps carry a tighter p, so the early phase is protected by</text>
<text x="66" y="341" font-size="11" fill="#4b5563">construction.</text>
<circle cx="42" cy="372" r="12" fill="#1d4ed8"/>
<text x="42" y="376" text-anchor="middle" fill="white" font-weight="bold" font-size="12">3</text>
<text x="66" y="377" font-weight="bold" font-size="12.5">An eligible flow ignores rate cuts until the receiver refuses it.</text>
<text x="66" y="397" font-size="11" fill="#4b5563">While exempt, the sender discards every congestion notification it receives. The receiver's first repair request re-</text>
<text x="66" y="413" font-size="11" fill="#4b5563">arms it. Refusal is the revocation signal, so an exemption cannot outlive the budget that justified it.</text>
</svg>
