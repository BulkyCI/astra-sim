name: Archive a bundle to the run's permanent release
description: >
  Download one of the run's Actions artifacts and publish it as an asset on the
  release opened by the `ledger` job. Actions artifacts expire; release assets
  do not, and they cost nothing against the storage quota.

inputs:
  tag:
    description: >
      Release tag from the `ledger` job. Empty disables archiving. Never derive
      this here: the tag is evaluated once per run so a partial re-run lands in
      the original release.
    required: true
  artifact:
    description: Name of the Actions artifact to archive.
    required: true
  source-directory:
    description: >
      Bundle directory already present on this runner. When set, the download
      step is skipped and the bundle is archived from this path in place: the
      caller fetched it earlier in the same job (typically for the ledger),
      and downloading a multi-gigabyte bundle a second time wastes minutes
      and doubles the disk footprint. The directory is consumed - large
      files are moved out and oversized ones deleted.
    required: false
    default: ''
  asset-name:
    description: Asset filename within the release, without the .tar.gz suffix.
    required: true
  token:
    description: Token holding the contents write scope on this repository.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
  - name: Download the bundle
    if: ${{ inputs.tag != '' && inputs.source-directory == '' }}
    # A cancelled producer leaves no artifact; that is a missing record, not a
    # reason to fail the sink job that is trying to record what does exist.
    continue-on-error: true
    uses: actions/download-artifact@v8
    with:
      name: ${{ inputs.artifact }}
      path: ${{ runner.temp }}/archive/${{ inputs.asset-name }}

  - name: Publish the bundle as a release asset
    if: ${{ inputs.tag != '' }}
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token }}
      # Inputs cross into the shell as data, never as interpolated script text.
      RELEASE_TAG: ${{ inputs.tag }}
      ASSET_NAME: ${{ inputs.asset-name }}
      ARCHIVE_ROOT: ${{ runner.temp }}/archive
      SOURCE_DIRECTORY: ${{ inputs.source-directory }}
      REPOSITORY: ${{ github.repository }}
    run: |
      set -euo pipefail

      # Archive in place when the caller already holds the bundle; the
      # staging root must exist either way because large files are renamed
      # into it before upload.
      source="${SOURCE_DIRECTORY:-${ARCHIVE_ROOT}/${ASSET_NAME}}"
      mkdir -p "${ARCHIVE_ROOT}"
      if [[ ! -d "$source" ]] || [[ -z "$(ls -A "$source")" ]]; then
        echo "No bundle to archive for ${ASSET_NAME}; nothing was produced." \
          >> "$GITHUB_STEP_SUMMARY"
        exit 0
      fi

      # Partition by size. Large files ship as their own assets, byte for
      # byte as the run produced them - the raw zstd stream must never be
      # compressed a second time - while small files travel together in one
      # tarball. GitHub hard-caps a single asset at 2 GiB: a larger file
      # cannot be carried at all, so it is warned about and left to the
      # run's Actions artifact rather than failing the archive.
      asset_cap=2147483648
      while IFS= read -r -d '' file; do
        rel="${file#"$source"/}"
        size="$(stat -c %s "$file")"
        if (( size >= asset_cap )); then
          echo "::warning::${rel} ($(( size / 2**20 )) MiB) exceeds the" \
            "2 GiB release-asset cap; it survives only in the Actions artifact"
          echo "Skipped \`${rel}\` ($(( size / 2**20 )) MiB): over the 2 GiB" \
            "release-asset cap." >> "$GITHUB_STEP_SUMMARY"
          rm "$file"
          continue
        fi
        # Asset names are flat; encode the in-bundle path into the name.
        name="${ASSET_NAME}--${rel//\//__}"
        mv "$file" "${ARCHIVE_ROOT}/${name}"
        echo "large asset: ${name} ($(( size / 2**20 )) MiB)"
        gh release upload "$RELEASE_TAG" "${ARCHIVE_ROOT}/${name}" \
          --clobber --repo "$REPOSITORY"
        echo "Archived \`${name}\` ($(( size / 2**20 )) MiB) to release" \
          "\`${RELEASE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
      done < <(find "$source" -type f -size +100M -print0)

      asset="${ARCHIVE_ROOT}/${ASSET_NAME}.tar.gz"
      tar -czf "$asset" -C "$source" .
      du -h "$asset" | cut -f1 | xargs echo "bundle asset size:"

      # `--clobber` is what makes a re-run idempotent: the asset is replaced in
      # place rather than rejected as a duplicate name.
      gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$REPOSITORY"

      size="$(du -h "$asset" | cut -f1)"
      echo "Archived \`${ASSET_NAME}.tar.gz\` (${size}) to release \
      \`${RELEASE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
