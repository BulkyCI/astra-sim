<text x="120" y="108" font-size="11" fill="#059669">no congestion control</text>
<rect x="100.5" y="118.5" width="11" height="11" fill="#7c3aed"/>
<text x="120" y="128" font-size="11" fill="#7c3aed">DCQCN</text>
<rect x="800" y="90" width="180" height="120" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="812" y="110" font-size="11.5" font-weight="bold">Pre-registered rule</text>
<text x="812" y="128" font-size="10.5" fill="#4b5563">operating region exists if</text>
<text x="812" y="143" font-size="10.5" fill="#4b5563">some cell reaches W ≥ 0.5</text>
<text x="812" y="158" font-size="10.5" fill="#4b5563">or a burst excess ≥ 20 %</text>
<text x="812" y="173" font-size="10.5" fill="#4b5563">of the window.</text>
<text x="812" y="188" font-size="10.5" fill="#4b5563"></text>
<text x="812" y="203" font-size="10.5" fill="#4b5563">Worst cell: W = 0.24,</text>
<text x="812" y="218" font-size="10.5" fill="#4b5563">excess 0.62 %.</text>
<rect x="20" y="430" width="960" height="70" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="32" y="450" font-size="11.5">The map returned the negative branch: with selective repeat, the burst episode is not something admission-time loss tolerance can shorten, anywhere.</text>
<text x="32" y="468" font-size="11.5" font-weight="bold">But it exposed the one large cost on the map: DCQCN cuts trimming 8 to 10x and pays 18 to 24 % of training time for it.</text>
<text x="32" y="486" font-size="11.5" font-weight="bold" fill="#166534">Its tail is the rate cut, not the repair. That penalty, not the burst, became the thing worth attacking.</text>
</svg>
