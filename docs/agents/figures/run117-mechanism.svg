<text x="32" y="424" font-size="11.5">Every seed discards about the same 2 GB of gradient, and that number predicts nothing. What predicts the saving is how many trims the discard prevented.</text>
<text x="32" y="444" font-size="11.5" font-weight="bold">The slope is 11.9 ms per million trims. The policy shed 2 GB and the fabric re-carried 156 GB less: on this transport a discarded byte is worth about 79 on the wire.</text>
